<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAATHI Emergency</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:#fff6f1;color:#1b1715;padding-bottom:env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;background:#7a1410;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;z-index:5}
.top b{font-size:18px;letter-spacing:1px}.top button{background:#ffffff26;border:1px solid #fff8;color:#fff;border-radius:20px;padding:5px 14px;font:inherit;font-size:14px}
main{max-width:520px;margin:0 auto;padding:16px}
#spot{background:#fff;border:2px solid #f28c1b;border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;margin-bottom:10px}
#sos{display:block;margin:18px auto;width:230px;height:230px;border-radius:50%;border:8px solid #fff;background:#d6201f;color:#fff;font-size:27px;font-weight:900;line-height:1.2;box-shadow:0 0 0 0 #d6201f88;animation:p 1.8s infinite;white-space:pre-line}
#sos small{display:block;font-size:14px;font-weight:500;margin-top:6px}
@keyframes p{80%,100%{box-shadow:0 0 0 30px #d6201f00}}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calls a,.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;color:#fff;background:#1f8a4c;width:100%}
.btn.r{background:#d6201f}.btn.o{background:#f28c1b}.btn.w{background:#25a244}.btn.g{background:#555}
.card{background:#fff;border:1px solid #eadfd5;border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-size:14px;color:#6b625c;margin:12px 0 3px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #cfc3b8;font:inherit;background:#fff;color:#1b1715}
#gps{font-size:14px;margin:8px 0 0}
.trk{display:flex;margin:14px 0}.trk div{flex:1;text-align:center;font-size:12px;color:#888}.trk i{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 4px;border-radius:50%;background:#ddd;color:#fff;font-style:normal}.trk .on{color:#1b1715;font-weight:700}.trk .on i{background:#1f8a4c}
#st{font-size:24px;font-weight:800;text-align:center;color:#d6201f;margin:4px 0}
.note{font-size:14px;color:#6b625c}.err{color:#d6201f;font-weight:700}
.tip{background:#fff3d6;border-radius:10px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><b>✚ SAATHI</b><button id="lang"></button></div>
<main>
<div id="spot" hidden></div>

<section id="home">
  <button id="sos"></button>
  <div class="calls"><a href="tel:112" data-t="c112"></a><a href="tel:108" data-t="c108"></a></div>
</section>

<section id="form" class="card" hidden>
  <b data-t="det"></b>
  <label data-t="phone"></label><input id="fp" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14">
  <label data-t="name"></label><input id="fn" autocomplete="name">
  <label data-t="cond"></label>
  <select id="fc"><option value="Unconscious">Unconscious / बेहोश</option><option value="Dizziness / weakness">Dizziness, weakness / चक्कर</option><option value="Chest pain / breathing">Chest pain, breathing / सीने में दर्द</option><option value="Injury / fracture">Injury / चोट</option><option value="Crowd crush">Crowd crush / भीड़ में दबाव</option><option value="Other">Other / अन्य</option></select>
  <button class="btn o" id="gbtn" type="button" style="margin-top:14px" data-t="gbtn"></button>
  <div id="gps"></div>
  <label data-t="place"></label>
  <select id="fland"><option value="">—</option><option>Ramkund</option><option>Godavari Ghat</option><option>Kapaleshwar Temple</option><option>Panchavati</option><option>Tapovan</option><option>Sita Gufa</option><option>Trimbakeshwar</option><option>Tent city / Sadhugram</option><option>Parking / bus stand</option><option>Not sure</option></select>
  <label data-t="near"></label><input id="fl" placeholder="Blue tent, pole 42…">
  <button class="btn r" id="send" style="margin-top:18px" data-t="send"></button>
  <p class="err" id="err"></p>
</section>

<section id="status" class="card" hidden>
  <div id="st"></div>
  <div class="note" style="text-align:center">ID: <b id="rid"></b> <span id="demo"></span></div>
  <div class="trk"><div class="on" id="t1"><i>✓</i><span data-t="r1"></span></div><div id="t2"><i>🚑</i><span data-t="r2"></span></div><div id="t3"><i>✔</i><span data-t="r3"></span></div></div>
  <div id="eta" style="text-align:center;font-weight:700"></div>
  <div class="tip" id="tip"></div>
  <div class="calls" style="margin-top:12px"><a class="btn w" id="wa" target="_blank" rel="noopener" data-t="wa"></a><a href="tel:112" data-t="c112"></a></div>
  <button class="btn g" id="cancel" style="margin-top:10px" data-t="cancel"></button>
</section>
<p class="note" style="text-align:center" data-t="foot"></p>
</main>

<script>
/* ===== SETUP ===== */
const TEAM_PHONE='';                                          // WhatsApp number with country code, e.g. 919XXXXXXXXX
const DEMO=location.protocol==='file:'; // opened from disk = demo mode
/* ================== */
const $=id=>document.getElementById(id);
const T={
en:{sos:'EMERGENCY\nHELP',c112:'📞 Call 112',c108:'🚑 Call 108',det:'Emergency details',phone:'Your mobile number *',name:'Your name (optional)',cond:'Patient condition',gbtn:'📍 Auto-detect my location',place:'Not sure where you are? Pick the nearest place',near:'Anything nearby (shop, board, pole no.)',send:'📡 Send signal',r1:'Received',r2:'On the way',r3:'Reached',wa:'💬 Share on WhatsApp',cancel:'Cancel (false alarm)',foot:'For life-threatening emergencies also call 112 / 108.',s_new:'📡 Alerting rescue team…',s_dis:'🚑 Rescuer is on the way',s_done:'✅ Rescuer has reached',s_can:'Request cancelled',locking:'📡 Detecting location… keep GPS on',locked:'✅ Location locked',rough:'⚠️ Only rough location. Turn ON GPS / high accuracy and tap again, or pick the nearest place.',blocked:'⚠️ Location blocked. Allow it, or pick the nearest place.',need:'Enter a valid 10-digit mobile number, plus GPS or a nearby place.',fail:'Could not send. Please call 112 / 108 or share on WhatsApp.',eta:'Arriving in about',min:'min',qr:'📍 You are at:'},
hi:{sos:'इमरजेंसी\nमदद',c112:'📞 112 कॉल',c108:'🚑 108 कॉल',det:'इमरजेंसी डिटेल्स',phone:'आपका मोबाइल नंबर *',name:'आपका नाम (वैकल्पिक)',cond:'मरीज़ की हालत',gbtn:'📍 मेरी लोकेशन अपने आप पता करें',place:'जगह पता नहीं? नज़दीकी जगह चुनें',near:'आसपास की निशानी (दुकान, बोर्ड, पोल नंबर)',send:'📡 सिग्नल भेजें',r1:'मिला',r2:'रास्ते में',r3:'पहुँचा',wa:'💬 WhatsApp पर भेजें',cancel:'रद्द करें (गलती से)',foot:'जान का खतरा हो तो 112 / 108 भी कॉल करें।',s_new:'📡 रेस्क्यू टीम को सूचना जा रही है…',s_dis:'🚑 रेस्क्यूअर रास्ते में है',s_done:'✅ रेस्क्यूअर पहुँच गया',s_can:'रिक्वेस्ट रद्द',locking:'📡 लोकेशन खोज रहे हैं… GPS चालू रखें',locked:'✅ लोकेशन मिल गई',rough:'⚠️ सिर्फ अंदाज़ा मिला। GPS / High accuracy ऑन करें और फिर दबाएँ, या नज़दीकी जगह चुनें।',blocked:'⚠️ लोकेशन बंद है। अनुमति दें या नज़दीकी जगह चुनें।',need:'सही 10 अंकों का मोबाइल नंबर और GPS या नज़दीकी जगह दें।',fail:'भेज नहीं सके। कृपया 112 / 108 कॉल करें या WhatsApp पर भेजें।',eta:'लगभग',min:'मिनट में पहुँचेगा',qr:'📍 आप यहाँ हैं:'},
mr:{sos:'आणीबाणी\nमदत',c112:'📞 112 कॉल',c108:'🚑 108 कॉल',det:'आणीबाणी तपशील',phone:'तुमचा मोबाइल नंबर *',name:'तुमचे नाव (ऐच्छिक)',cond:'रुग्णाची स्थिती',gbtn:'📍 माझे लोकेशन आपोआप शोधा',place:'जागा माहीत नाही? जवळची जागा निवडा',near:'जवळची खूण (दुकान, बोर्ड, पोल नंबर)',send:'📡 सिग्नल पाठवा',r1:'मिळाले',r2:'वाटेत',r3:'पोहोचला',wa:'💬 WhatsApp वर पाठवा',cancel:'रद्द करा (चुकून)',foot:'जीवघेणी स्थिती असल्यास 112 / 108 ही कॉल करा.',s_new:'📡 बचाव पथकाला कळवत आहोत…',s_dis:'🚑 बचावकर्ता वाटेत आहे',s_done:'✅ बचावकर्ता पोहोचला',s_can:'विनंती रद्द',locking:'📡 लोकेशन शोधत आहे… GPS चालू ठेवा',locked:'✅ लोकेशन मिळाले',rough:'⚠️ फक्त अंदाजे लोकेशन. GPS / High accuracy चालू करा आणि पुन्हा दाबा, किंवा जवळची जागा निवडा.',blocked:'⚠️ लोकेशन बंद आहे. परवानगी द्या किंवा जवळची जागा निवडा.',need:'योग्य 10 अंकी मोबाइल नंबर आणि GPS किंवा जवळची जागा द्या.',fail:'पाठवता आले नाही. कृपया 112 / 108 कॉल करा किंवा WhatsApp वर पाठवा.',eta:'सुमारे',min:'मिनिटांत पोहोचेल',qr:'📍 तुम्ही येथे आहात:'}};
const TIPS={'Unconscious':['Check breathing. If breathing, gently turn them on their side. No food or water.','श्वास देखें। साँस चल रही हो तो करवट पर लिटाएँ। खाना-पानी न दें।','श्वास तपासा. श्वास सुरू असल्यास कुशीवर झोपवा. खाणे-पाणी देऊ नका.'],
'Dizziness / weakness':['Sit or lay them in shade, loosen clothing. Sips of water only if fully awake.','छाँव में बैठाएँ/लिटाएँ, कपड़े ढीले करें। पूरी तरह होश में हों तभी थोड़ा पानी दें।','सावलीत बसवा/झोपवा, कपडे सैल करा. पूर्ण शुद्धीत असेल तरच थोडे पाणी द्या.'],
'Chest pain / breathing':['Keep them seated and calm, loosen clothing. Call 112 / 108 now.','बैठा कर शांत रखें, कपड़े ढीले करें। अभी 112 / 108 कॉल करें।','बसवून शांत ठेवा, कपडे सैल करा. आत्ता 112 / 108 कॉल करा.'],
'Injury / fracture':['Do not move the injured part. Press a clean cloth on bleeding.','चोट वाले हिस्से को न हिलाएँ। खून बहे तो साफ कपड़ा दबाएँ।','जखमी भाग हलवू नका. रक्तस्राव असल्यास स्वच्छ कापड दाबा.'],
'Crowd crush':['Move to a side or open space if possible; keep them seated, check breathing.','हो सके तो किनारे/खुली जगह जाएँ; बैठा रखें, साँस देखें।','शक्य असल्यास कडेला/मोकळ्या जागी जा; बसवून ठेवा, श्वास तपासा.'],
'Other':['Stay with the patient and keep them calm.','मरीज़ के साथ रहें, उन्हें शांत रखें।','रुग्णासोबत रहा, शांत ठेवा.']};
const LG=['en','hi','mr'];let li=0;try{const n=(navigator.language||'').slice(0,2);li=Math.max(0,LG.indexOf(n))}catch(e){}
let lang=LG[li],coords=null,acc=null,src='gps',wid=null,rid=null,poller=null,cur=null,spot=null;
const t=k=>T[lang][k]||T.en[k];
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('sos').innerHTML=t('sos')+'<small>Human Ambulance</small>';$('lang').textContent={en:'हिंदी',hi:'मराठी',mr:'English'}[lang];
 if(spot){$('spot').textContent=t('qr')+' '+spot}if(cur)show(cur)}
$('lang').onclick=()=>{li=(li+1)%3;lang=LG[li];apply()};
/* location */
function stopW(){if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null}}
function showG(p){const a=Math.round(p.coords.accuracy),l='<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+p.coords.latitude+','+p.coords.longitude+'">map</a>';
 $('gps').innerHTML=a>1000?t('rough'):t('locked')+' (±'+a+' m) · '+l}
function detect(){if(!navigator.geolocation){return}
 stopW();acc=null;coords=null;src='gps';$('gps').textContent=t('locking');let best=null;
 wid=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy){best=p;coords=[p.coords.latitude,p.coords.longitude];acc=Math.round(p.coords.accuracy);showG(p)}if(p.coords.accuracy<=30)stopW()},
 ()=>{$('gps').textContent=t('blocked')},{enableHighAccuracy:true,timeout:30000,maximumAge:0});setTimeout(stopW,45000)}
$('gbtn').onclick=detect;
$('sos').onclick=()=>{$('home').hidden=true;$('form').hidden=false;scrollTo(0,0);if(src!=='qr')detect();else $('gps').textContent='🔲 '+spot};
/* send */
async function send(){
 $('err').textContent='';
 const ph=$('fp').value.replace(/\D/g,'').slice(-10);
 let loc=[$('fland').value,$('fl').value.trim()].filter(Boolean).join(' – ');
 if(!/^[6-9]\d{9}$/.test(ph)||(!loc&&(!coords||acc>1000))){$('err').textContent=t('need');return}
 if(!loc)loc='GPS location';
 rid='SA'+Math.random().toString(36).slice(2,7).toUpperCase();stopW();
 const d={rid,name:$('fn').value.trim()||'Unknown',phone:ph,loc,cond:$('fc').value,lat:coords?coords[0]:null,lng:coords?coords[1]:null,acc:acc,src:src,lang:lang,status:'new',ts:Date.now()};
 $('send').disabled=true;
 try{if(!DEMO){const r=await fetch('/api/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw 0;const j=await r.json();rid=j.rid;d.rid=rid}}
 catch(e){$('send').disabled=false;$('err').textContent=t('fail');wa(d);$('status').hidden=false;$('st').textContent='';return}
 try{localStorage.setItem('saathi_rid',rid)}catch(e){}
 begin(d)}
function wa(d){const pos=d.lat!=null?'https://www.google.com/maps?q='+d.lat+','+d.lng:d.loc;
 const m='SAATHI EMERGENCY '+d.rid+': '+d.cond+'. Location: '+pos+' ('+d.loc+'). Phone: '+d.phone;$('wa').href='https://wa.me/'+TEAM_PHONE+'?text='+encodeURIComponent(m)}
function begin(d){$('form').hidden=true;$('home').hidden=true;$('status').hidden=false;$('rid').textContent=d.rid;wa(d);cur=d;show(d);
 if(DEMO){$('demo').textContent='(DEMO)';setTimeout(()=>show({...d,status:'dispatched',eta:5}),3000);setTimeout(()=>show({...d,status:'done'}),9000)}
 else{poller=setInterval(poll,4000)}}
async function poll(){try{const r=await fetch('/api/request/'+rid);if(!r.ok)return;const d=await r.json();if(d&&d.rid)show(d)}catch(e){}}
function show(d){cur=d;const s=d.status,i=Math.max(0,LG.indexOf(lang));
 $('st').textContent=t(s==='dispatched'?'s_dis':s==='done'?'s_done':s==='cancelled'?'s_can':'s_new');
 $('t2').className=s==='dispatched'||s==='done'?'on':'';$('t3').className=s==='done'?'on':'';
 $('eta').textContent=s==='dispatched'&&d.eta?t('eta')+' '+d.eta+' '+(lang==='en'?t('min'):t('min')):'';
 $('tip').textContent=(TIPS[d.cond]||TIPS.Other)[i];
 if(s==='done'||s==='cancelled'){clearInterval(poller);try{localStorage.removeItem('saathi_rid')}catch(e){}}}
$('send').onclick=send;
$('cancel').onclick=async()=>{if(!rid)return location.reload();try{if(!DEMO)await fetch('/api/request/'+rid+'/cancel',{method:'POST'})}catch(e){}show({...cur,status:'cancelled'});setTimeout(()=>location.reload(),2500)};
/* QR spot + resume */
(async()=>{const q=new URLSearchParams(location.search);spot=q.get('spot');
 if(spot){$('spot').hidden=false;$('fl').value=spot;const la=parseFloat(q.get('lat')),ln=parseFloat(q.get('lng'));
  if(!isNaN(la)&&!isNaN(ln)){coords=[la,ln];acc=5;src='qr'}}
 apply();
 if(q.get('sos')||spot){$('sos').click();if(src==='qr'){stopW();$('gps').textContent='🔲 '+spot}}
 try{const old=localStorage.getItem('saathi_rid');if(old&&!DEMO){const r=await fetch('/api/request/'+old);const d=r.ok?await r.json():null;if(d&&d.rid&&d.status!=='done'&&d.status!=='cancelled'&&Date.now()-d.ts<6*3600e3){rid=old;begin(d)}}}catch(e){}
})();
</script>
</body>
</html>
