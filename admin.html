<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SAATHI Control Room</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#14110f;color:#f5efea}
.top{position:sticky;top:0;background:#7a1410;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:10px;align-items:center;z-index:5}
.top b{margin-right:auto}.top button{background:#ffffff26;border:1px solid #fff8;color:#fff;border-radius:20px;padding:4px 12px;font:inherit;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px}
#gate{max-width:320px;margin:80px auto;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #4a423c;background:#1f1b18;color:#fff;font:inherit;margin:10px 0}
.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:700;color:#fff;background:#d6201f;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:#f28c1b}.btn.g{background:#1f8a4c}.btn.x{background:#555}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{background:#1f1b18;border:1px solid #342d28;border-radius:12px;text-align:center;padding:10px}.st b{display:block;font-size:26px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid #4a423c;background:#1f1b18;color:#fff;font:inherit}.tabs .a{background:#d6201f;border-color:#d6201f}
.card{background:#1f1b18;border:1px solid #342d28;border-left:6px solid #d6201f;border-radius:12px;padding:14px;margin:10px 0}
.card.d{border-left-color:#f28c1b}.card.c{border-left-color:#1f8a4c;opacity:.6}.card.x{border-left-color:#777;opacity:.5}
.card.new{animation:fl 1s 3}@keyframes fl{50%{background:#5a1a16}}
.card p{margin:3px 0}.m{color:#aaa19a;font-size:14px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
a{color:#ffb347}.warn{color:#ffb347}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="gate"><h2>✚ SAATHI Control Room</h2><input id="pin" type="password" placeholder="Admin PIN" inputmode="numeric"><button class="btn" id="go" style="width:100%">Login</button><p class="m" id="ge"></p></div>

<div id="app" hidden>
<div class="top"><b>✚ Control Room</b><button id="snd">🔔 On</button><button id="out">Logout</button></div>
<main>
  <div class="stats"><div class="st"><b id="n1">0</b><span class="m">New</span></div><div class="st"><b id="n2">0</b><span class="m">On the way</span></div><div class="st"><b id="n3">0</b><span class="m">Done</span></div></div>
  <div class="tabs"><button id="ta" class="a">Active</button><button id="tl">All</button></div>
  <p class="m" id="conn"></p>
  <div id="list"></div>
  <details style="margin-top:24px"><summary><b>📲 QR Spot Generator</b></summary>
   <input id="qn" placeholder="Spot name e.g. Ramkund Gate 2, Pole 14"><input id="qc" placeholder="Lat, Lng (optional)">
   <button class="btn g" id="qh">📍 Use my location</button> <button class="btn" id="qg">Generate QR</button> <button class="btn x" onclick="print()">🖨️ Print</button>
   <div style="text-align:center;margin-top:14px"><div id="qr" style="display:inline-block;background:#fff;padding:12px;border-radius:12px"></div><p id="qt" style="font-weight:800"></p></div>
  </details>
</main>
</div>

<script>
let PIN='';const H=()=>({'x-admin-pin':PIN,'content-type':'application/json'});
const $=id=>document.getElementById(id);
let items=[],seen=new Set(),first=true,sound=true,tab='a',timer=null;
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
async function login(){PIN=$('pin').value;$('ge').textContent='…';
 try{const r=await fetch('/api/admin/list',{headers:H()});
  if(r.status===401){$('ge').textContent='Wrong PIN';return}
  if(!r.ok){$('ge').textContent=r.status===500?'Server: set ADMIN_PIN in Netlify':'Server error';return}
  try{sessionStorage.setItem('saathi_pin',PIN)}catch(e){}$('ge').textContent='';start()}
 catch(e){$('ge').textContent='Cannot reach server'}}
$('go').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};
$('out').onclick=()=>{try{sessionStorage.removeItem('saathi_pin')}catch(e){}location.reload()};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔔 On':'🔕 Off'};
$('ta').onclick=()=>{tab='a';$('ta').className='a';$('tl').className='';render()};
$('tl').onclick=()=>{tab='l';$('tl').className='a';$('ta').className='';render()};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=900;o.start();setTimeout(()=>{o.stop();c.close()},500)}catch(e){}}
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h ago'}
async function load(){
 try{const r=await fetch('/api/admin/list',{headers:H()});if(r.status===401){sessionStorage.removeItem('saathi_pin');location.reload();return}if(!r.ok)throw 0;
  items=await r.json();$('conn').textContent='🟢 Live · updated '+new Date().toLocaleTimeString();
  const fresh=items.filter(x=>x.status==='new'&&!seen.has(x.rid));items.forEach(x=>seen.add(x.rid));
  if(!first&&fresh.length&&sound){beep();document.title='🚨 ('+fresh.length+') NEW · SAATHI'}else if(!fresh.length)document.title='SAATHI Control Room';
  first=false;render(fresh.map(x=>x.rid))}
 catch(e){$('conn').textContent='🔴 Connection problem, retrying…'}}
function render(fresh=[]){
 const c=s=>items.filter(x=>x.status===s).length;$('n1').textContent=c('new');$('n2').textContent=c('dispatched');$('n3').textContent=c('done');
 const v=tab==='a'?items.filter(x=>x.status==='new'||x.status==='dispatched'):items;
 $('list').innerHTML=v.length?v.map(r=>{
  const cls=r.status==='dispatched'?'d':r.status==='done'?'c':r.status==='cancelled'?'x':'';
  const map=r.lat!=null?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">📍 Open map</a>`:'';
  const q=r.src==='qr'?' 🔲 QR spot (exact)':r.acc>1000?' <span class="warn">⚠️ rough GPS ±'+Math.round(r.acc/1000)+' km</span>':r.acc?' (±'+r.acc+' m)':'';
  const wa='https://wa.me/91'+esc(r.phone)+'?text='+encodeURIComponent('SAATHI: help is on the way. ID '+r.rid);
  return `<div class="card ${cls} ${fresh.includes(r.rid)?'new':''}"><b>${esc(r.rid)} · ${esc(r.cond)}</b> <span class="m">· ${ago(r.ts)} · ${esc(r.status)}${r.eta?' · ETA '+esc(r.eta)+' min':''}</span>
  <p>👤 ${esc(r.name)} · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></p><p>📌 ${esc(r.loc)}${q}</p><p>${map}</p>
  <div class="acts"><button class="btn o" data-a="dis" data-i="${esc(r.rid)}">🚑 Dispatch</button><button class="btn g" data-a="done" data-i="${esc(r.rid)}">✔ Done</button><a class="btn x" href="tel:${esc(r.phone)}">📞 Call</a><a class="btn x" target="_blank" rel="noopener" href="${wa}">💬 WhatsApp</a></div></div>`}).join(''):'<p class="m">No requests.</p>';
 $('list').querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.i,b.dataset.a));}
async function act(id,a){let body;
 if(a==='dis'){const m=parseInt(prompt('Estimated arrival (minutes)?','5'),10);body={rid:id,status:'dispatched',eta:isNaN(m)?null:m}}else body={rid:id,status:'done'};
 try{const r=await fetch('/api/admin/update',{method:'POST',headers:H(),body:JSON.stringify(body)});if(!r.ok)throw 0;load()}catch(e){alert('Update failed, try again')}}
$('qg').onclick=()=>{const n=$('qn').value.trim();if(!n)return alert('Spot name?');const u=new URL('./',location.href);u.searchParams.set('spot',n);
 const c=$('qc').value.split(',').map(parseFloat);if(c.length==2&&c.every(x=>!isNaN(x))){u.searchParams.set('lat',c[0]);u.searchParams.set('lng',c[1])}
 $('qr').innerHTML='';new QRCode($('qr'),{text:u.href,width:220,height:220});$('qt').textContent='🚨 EMERGENCY · SAATHI — '+n};
$('qh').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('qc').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},()=>alert('Allow location'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
function start(){$('gate').hidden=true;$('app').hidden=false;load();timer=setInterval(load,4000)}
try{const sp=sessionStorage.getItem('saathi_pin');if(sp){PIN=sp;start()}}catch(e){}
</script>
</body>
</html>
